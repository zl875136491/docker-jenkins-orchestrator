version: "1"
aliases:
  "c++": cpp
  "react.js": react
  "vue.js": vue
  "next.js": nextjs
  html5: html
  "html+css+js": html
components:
  python:
    images:
      - python:3.11.11-slim-bookworm
      - python:3.12.8-slim-bookworm
      - python:3.13.1-slim-bookworm
    port: 8000
    publish_ports: true
    working_dir: /workspace
    restart: unless-stopped
    environment:
      PORT: "8000"
      PYTHONUNBUFFERED: "1"
    connection:
      environment:
        PYTHON_HOST: "{host}"
        PYTHON_PORT: "{port}"
        PYTHON_URL: "http://{host}:{port}"

  go:
    images:
      - golang:1.22.10-alpine3.20
      - golang:1.23.4-alpine3.20
      - golang:1.24.0-alpine3.21
    port: 8080
    publish_ports: true
    working_dir: /workspace
    restart: unless-stopped
    environment:
      PORT: "8080"
    connection:
      environment:
        GO_HOST: "{host}"
        GO_PORT: "{port}"
        GO_URL: "http://{host}:{port}"

  java:
    images:
      - eclipse-temurin:17.0.13_11-jre-jammy
      - eclipse-temurin:21.0.5_11-jre-jammy
      - eclipse-temurin:23.0.1_11-jre-jammy
    port: 8080
    publish_ports: true
    working_dir: /workspace
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
    connection:
      environment:
        JAVA_HOST: "{host}"
        JAVA_PORT: "{port}"
        JAVA_URL: "http://{host}:{port}"

  cpp:
    images:
      - gcc:12.4.0-bookworm
      - gcc:13.3.0-bookworm
      - gcc:14.2.0-bookworm
    port: 8080
    publish_ports: true
    working_dir: /workspace
    restart: unless-stopped
    environment:
      PORT: "8080"
    connection:
      environment:
        CPP_HOST: "{host}"
        CPP_PORT: "{port}"
        CPP_URL: "http://{host}:{port}"

  react:
    images:
      - node:20.18.1-alpine3.20
      - node:22.11.0-alpine3.20
      - node:24.0.0-alpine3.21
    port: 3000
    publish_ports: true
    working_dir: /workspace
    restart: unless-stopped
    environment:
      PORT: "3000"
    connection:
      environment:
        REACT_HOST: "{host}"
        REACT_PORT: "{port}"
        REACT_URL: "http://{host}:{port}"

  vue:
    images:
      - node:20.18.1-alpine3.20
      - node:22.11.0-alpine3.20
      - node:24.0.0-alpine3.21
    port: 3000
    publish_ports: true
    working_dir: /workspace
    restart: unless-stopped
    environment:
      PORT: "3000"
    connection:
      environment:
        VUE_HOST: "{host}"
        VUE_PORT: "{port}"
        VUE_URL: "http://{host}:{port}"

  nextjs:
    images:
      - node:20.18.1-alpine3.20
      - node:22.11.0-alpine3.20
      - node:24.0.0-alpine3.21
    port: 3000
    publish_ports: true
    working_dir: /workspace
    restart: unless-stopped
    environment:
      PORT: "3000"
    connection:
      environment:
        NEXTJS_HOST: "{host}"
        NEXTJS_PORT: "{port}"
        NEXTJS_URL: "http://{host}:{port}"

  html:
    images:
      - nginx:1.26.3-alpine
      - nginx:1.27.4-alpine
      - nginx:1.28.0-alpine
    port: 80
    publish_ports: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    connection:
      environment:
        HTML_HOST: "{host}"
        HTML_PORT: "{port}"
        HTML_URL: "http://{host}:{port}"

  mongodb:
    images:
      - mongo:7.0.16-jammy
      - mongo:8.0.4-noble
      - mongo:8.0.5-noble
    port: 27017
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: "app"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD}"
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:-app}"
    volumes:
      - source: data
        target: /data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host 127.0.0.1 --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    connection:
      environment:
        MONGODB_HOST: "{host}"
        MONGODB_PORT: "{port}"
        MONGODB_URI: "mongodb://{host}:{port}"

  mysql:
    images:
      - mysql:8.0.40
      - mysql:8.4.3
      - mysql:9.1.0
    port: 3306
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "app"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}"
      MYSQL_USER: "app"
    volumes:
      - source: data
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    connection:
      environment:
        MYSQL_HOST: "{host}"
        MYSQL_PORT: "{port}"
        MYSQL_URI: "mysql://{host}:{port}"

  postgresql:
    images:
      - postgres:15.11-bookworm
      - postgres:16.7-bookworm
      - postgres:17.3-bookworm
    port: 5432
    restart: unless-stopped
    environment:
      POSTGRES_DB: "app"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_USER: "app"
    volumes:
      - source: data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    connection:
      environment:
        POSTGRESQL_HOST: "{host}"
        POSTGRESQL_PORT: "{port}"
        POSTGRESQL_URI: "postgresql://{host}:{port}"

  redis:
    images:
      - redis:7.2.7-alpine3.20
      - redis:7.4.2-alpine3.21
      - redis:8.0.0-alpine3.21
    port: 6379
    restart: unless-stopped
    volumes:
      - source: data
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    connection:
      environment:
        REDIS_HOST: "{host}"
        REDIS_PORT: "{port}"
        REDIS_URL: "redis://{host}:{port}/0"

  minio:
    images:
      - minio/minio:RELEASE.2024-06-13T22-53-53Z
      - minio/minio:RELEASE.2024-10-13T13-34-11Z
      - minio/minio:RELEASE.2025-01-20T14-49-01Z
    ports: [9000, 9001]
    publish_ports: true
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-app}"
    volumes:
      - source: data
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    connection:
      environment:
        MINIO_ENDPOINT: "http://{host}:{port}"
        MINIO_HOST: "{host}"
        MINIO_PORT: "{port}"

  etcd:
    images:
      - quay.io/coreos/etcd:v3.5.15
      - quay.io/coreos/etcd:v3.5.16
      - quay.io/coreos/etcd:v3.5.17
    port: 2379
    restart: unless-stopped
    volumes:
      - source: data
        target: /etcd-data
    healthcheck:
      test: ["CMD-SHELL", "etcdctl endpoint health --endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    connection:
      environment:
        ETCD_ENDPOINTS: "http://{host}:{port}"
        ETCD_HOST: "{host}"
        ETCD_PORT: "{port}"
