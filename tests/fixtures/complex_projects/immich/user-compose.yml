version: "3.9"
name: immich
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    environment:
      DB_HOSTNAME: immich-database
      REDIS_HOSTNAME: immich-redis
      DB_USERNAME: immich
      DB_PASSWORD: user-managed-secret
      DB_DATABASE_NAME: immich
      UPLOAD_LOCATION: /data
    volumes:
      - /srv/immich/upload:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2283:2283"
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-database:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2283/api/server/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    environment:
      TRANSFORMERS_CACHE: /cache
    volumes:
      - immich-model-cache:/cache
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/"]
      interval: 30s
  immich-redis:
    image: docker.io/valkey/valkey:9-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: user-managed-secret
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /srv/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "immich"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  immich-model-cache: {}
